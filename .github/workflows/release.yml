name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
          bundler-cache: true
      - name: Build gem
        run: gem build activemail.gemspec
      # Credentials expire 15 minutes after this step, so build first.
      - uses: rubygems/configure-rubygems-credentials@8674aee7f9f9055a8b771794d6f1e66b5fad36a9
      - name: Push to RubyGems
        run: gem push activemail-*.gem
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          notes=$(awk -v v="${TAG#v}" '
            $0 ~ "^## \\[" v "\\]" {grab=1; next}
            grab && /^## \[/ {exit}
            grab && /^\[[^]]+\]:/ {exit}
            grab {print}
          ' CHANGELOG.md)
          gh release create "$TAG" --title "$TAG" \
            --notes "${notes:-See [CHANGELOG.md](CHANGELOG.md).}"
